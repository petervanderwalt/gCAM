name: Browser workflows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: react
    env:
      CYPRESS_CACHE_FOLDER: ${{ github.workspace }}/react/.cache/Cypress
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: react/yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: xvfb-run -a yarn test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            react/cypress/screenshots
            react/cypress/videos
          if-no-files-found: ignore
